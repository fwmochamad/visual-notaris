name: CI
on:
  push:
  pull_request:
jobs:
  addin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tes unit
        run: npm test
      - name: Cek kompatibilitas ES5 (Word 2016 / IE11)
        run: npm run lint:es5
      - name: Validasi manifest
        run: npm run validate:manifest
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Tes API (SQLite)
        run: npm test
      - name: Tes API (Postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: node --no-warnings --test --test-force-exit test/api.test.js
